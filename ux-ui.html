<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UX/UI - Candela Ribas</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <script src="./assets/js/translations.js" defer></script>
  <script src="./assets/js/main.js" defer></script>
  <style>
    html, body {
      background: #f3f3f0;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .editor {
      padding: 5rem 0.5rem;
      max-width: 1050px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .editor .section-title {
      text-align: center;
      margin-bottom: 3.5rem;
      line-height: 1;
    }

    /* Fixed Back button matching project-editor page (below sticky nav) */
    .editor > a.btn.btn-primary {
      position: fixed;
      top: 5.5rem;
      left: 3rem;
      z-index: 1200;
    }

    @media (max-width: 640px) {
      .editor > a.btn.btn-primary {
        top: 4.5rem;
        left: 1.5rem;
      }
      .editor .section-title {
        font-size: 5rem;
        margin-top: 4.5rem;
        margin-bottom: 4rem; /* más aire sobre el carrusel */
      }
    }

    @media (max-width: 480px) {
      .editor > a.btn.btn-primary {
        top: 4rem;
        left: 1.25rem;
      }
      .editor .section-title {
        font-size: 3.8rem;
        margin-top: 3.5rem;
        margin-bottom: 3.25rem; /* más aire sobre el carrusel */
      }
    }

    /* 3 Horizontal square image buttons container */
    .ux-options-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(0.75rem, 2.5vw, 2.5rem);
      padding: 0 1rem;
      box-sizing: border-box;
    }

    .ux-option-card {
      position: relative;
      display: block;
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #eaeaea;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      text-decoration: none;
      transition: transform 0.25s var(--ease-out), box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }

    .ux-option-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .ux-option-card:hover {
        transform: translateY(-8px) scale(1.03);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
        border-color: rgba(0, 0, 0, 0.15);
      }
      .ux-option-card:hover img {
        transform: scale(1.06);
      }
    }

    .ux-option-card:active {
      transform: translateY(-2px) scale(0.99);
    }

    .ux-option-card:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 4px;
    }

    @media (max-width: 640px) {
      .ux-options-container {
        grid-template-columns: 1fr;
        gap: 2.25rem;
        width: 54%;
        max-width: 230px;
        margin: 0 auto 3rem auto;
        padding: 0;
      }
      .ux-option-card {
        border-radius: 10px;
        aspect-ratio: auto;
      }
      .ux-option-card img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
    }

    /* MOBILE: horizontal carousel for the 3 option cards.
       Only affects <=640px; desktop keeps the exact 3-column grid above. */
    @media (max-width: 640px) {
      .ux-options-container {
        display: flex;
        flex-direction: row;
        gap: 6vw;                     /* visible, uniform gap: cards never glued */
        width: 100%;
        max-width: none;
        margin: 0 auto 3rem auto;
        padding: 0.5rem 0;
        overflow-x: auto;
        overflow-y: hidden;
        /* no scroll-snap: the JS snaps by index with smooth animation */
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        box-sizing: content-box;
        /* vertical padding so the scaled-up (1.2) active card is not clipped
           by overflow-x:auto forcing overflow-y to clip */
        padding-top: 3rem;
        padding-bottom: 3rem;
        margin-top: -2.5rem;
        margin-bottom: 0.5rem;
      }
      .ux-options-container::-webkit-scrollbar { display: none; }

      .ux-option-card {
        flex: 0 0 56vw;               /* card width: unchanged */
        max-width: 56vw;
        aspect-ratio: 1 / 1;
        width: auto;
        height: auto;
        border-radius: 10px;
        transform: scale(1);          /* side cards: normal size */
        transition: transform 0.3s var(--ease-out), box-shadow 0.25s ease, border-color 0.25s ease;
      }

      /* Centered card: 20% bigger — driven by JS .active, never by hover */
      .ux-option-card.active {
        transform: scale(1.2);
        z-index: 2;                   /* above neighbours, never behind */
      }

      .ux-option-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }

    @media (max-width: 380px) {
      .ux-options-container { gap: 5vw; }
      .ux-option-card { flex-basis: 58vw; max-width: 58vw; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-container">

  <main class="editor">
    <a class="btn btn-primary" href="index.html#projects" aria-label="Volver a Proyectos" data-i18n="editor.back">← Back</a>

    <h1 class="section-title" data-i18n="title.ux-ui">ux/ui</h1>

    <!-- 3 square options placed horizontally side by side -->
    <div class="ux-options-container">
      <a href="project-editor.html?project=ux-ui-1" class="ux-option-card" aria-label="Abrir subapartado 1 de UX/UI">
        <img src="https://ik.imagekit.io/7zyxg26dj/zampo%20cover.png" alt="UX/UI Opción 1" loading="eager" />
      </a>
      <a href="project-editor.html?project=ux-ui-2" class="ux-option-card" aria-label="Abrir subapartado 2 de UX/UI">
        <img src="https://ik.imagekit.io/7zyxg26dj/monel%20cover.png?updatedAt=1792597032476" alt="UX/UI Opción 2" loading="eager" />
      </a>
      <a href="project-editor.html?project=ux-ui-3" class="ux-option-card" aria-label="Abrir subapartado 3 de UX/UI">
        <img src="https://ik.imagekit.io/7zyxg26dj/desafio%20gourmet%20cover.png?updatedAt=1792597032447" alt="UX/UI Opción 3" loading="eager" />
      </a>
    </div>
  <script>
    // Mobile infinite carousel — index-based, one-card-per-swipe, both
    // directions, no visible start or end.
    //
    // How it works:
    // - 9 identical sets of the 3 cards are rendered (4 clone sets left,
    //   the originals, 4 clone sets right).
    // - `logical` position is a card index within a set (0..2) plus a running
    //   set offset `base` that never resets (grows/shrinks freely) => the
    //   direction of the gesture is always preserved.
    // - scrollToCard(idx) centers card idx with a smooth animation.
    // - after a swipe ends, we advance exactly one card in the gesture's
    //   direction and animate there, then `recenter()` silently shifts the
    //   scroll back by whole sets when we drift too far (pixel-identical jump).
    (function(){
      const track = document.querySelector('.ux-options-container');
      if(!track) return;
      const originals = Array.from(track.querySelectorAll('.ux-option-card'));
      if(!originals.length) return;
      if(!window.matchMedia('(max-width: 640px)').matches) return; // desktop untouched

      const N = originals.length;              // 3
      const SETS_PER_SIDE = 4;
      // Left clones: build each set in a fragment so the original order
      // (card1 → card2 → card3) is preserved. insertBefore one-by-one
      // would reverse the set and put two equal cards next to each other.
      for(let i = 0; i < SETS_PER_SIDE; i++){
        const frag = document.createDocumentFragment();
        originals.forEach(c => frag.appendChild(c.cloneNode(true)));
        track.insertBefore(frag, track.firstChild);
      }
      for(let i = 0; i < SETS_PER_SIDE; i++){
        const frag = document.createDocumentFragment();
        originals.forEach(c => frag.appendChild(c.cloneNode(true)));
        track.appendChild(frag);
      }
      const allCards = Array.from(track.querySelectorAll('.ux-option-card'));
      const START = SETS_PER_SIDE * N;         // index of first original card

      // step = card width + gap (measured, includes flex gap)
      const step = () => allCards[START + 1].offsetLeft - allCards[START].offsetLeft;

      // logical position: START + n (n can grow/shrink without limit)
      let n = 0;                                // 0 => originals[0] centered
      let animating = false;
      let pending = 0;                          // gestures queued while animating
      let animId = null;
      let touchStartX = 0, touchStartY = 0, touchMoved = false, gestureActive = false;

      // Real resting scrollLeft for card idx so that its CENTER coincides
      // with the CENTER of the track (viewport). Measured from the DOM, so
      // card width, gap, margins and padding are all accounted for.
      function centerScrollLeft(idx){
        const tr = track.getBoundingClientRect();
        const cr = allCards[idx].getBoundingClientRect();
        const cur = track.scrollLeft;
        // delta needed to bring the card's center to the track's center
        return cur + (cr.left + cr.width / 2) - (tr.left + tr.width / 2);
      }

      function scrollToCard(idx, smooth){
        const target = centerScrollLeft(idx);
        if(smooth && typeof track.scrollBy === 'function'){
          track.scrollBy({ left: target - track.scrollLeft, behavior: 'smooth' });
        } else {
          track.scrollLeft = target;
        }
      }

      function updateActive(){
        const s = track.scrollLeft;
        const i = Math.round((s - centerScrollLeft(START)) / step());
        const idx = Math.min(allCards.length - 1, Math.max(0, i));
        allCards.forEach((c, k) => c.classList.toggle('active', k === idx));
      }

      // Silent recenter: shift scroll by whole sets so we stay near the middle
      // band. All cards are equally spaced, so shifting by whole sets is a
      // pixel-identical jump and never changes the logical card.
      function recenter(){
        const base = centerScrollLeft(START);  // resting position of card START
        const s = track.scrollLeft;
        const st = step();
        const i = Math.round((s - base) / st); // current global card index
        const rel = i - 0;                     // offset from originals (n)
        const span = (SETS_PER_SIDE - 1) * N;  // allowed drift (±1 set)
        if(Math.abs(rel) > span){
          const shift = Math.round(rel / N) * N; // whole sets only
          track.scrollLeft = s - shift * st;   // instant, invisible
        }
      }

      // Settle watcher: always terminates (timeout safety net), so `animating`
      // can never stay true forever — this was the cause of the lock-up.
      function go(delta){
        if(animating){ pending += delta; return; } // queue quick successive swipes
        animating = true;
        n += delta;                            // direction preserved, unbounded
        const idx = n + START;
        const target = centerScrollLeft(idx);  // measured BEFORE scrolling starts
        scrollToCard(idx, true);
        const t0 = performance.now();
        let lastS = track.scrollLeft;
        let still = 0;
        (function check(now){
          const s = track.scrollLeft;
          const diff = Math.abs(s - target);
          if(diff < 2){
            // settled: finish and unlock, then flush queued gestures
            updateActive();
            recenter();
            animating = false;
            if(pending !== 0){ const p = pending; pending = 0; go(p); }
          } else if(now - t0 > 1200){
            // smooth scroll stalled (interrupted): jump instantly to target
            track.scrollLeft = target;
            updateActive();
            recenter();
            animating = false;
            if(pending !== 0){ const p = pending; pending = 0; go(p); }
          } else {
            if(Math.abs(s - lastS) < 0.5){ still++; } else { still = 0; lastS = s; }
            if(still > 24){                    // scroll stopped short of target
              track.scrollLeft = target;
              updateActive();
              recenter();
              animating = false;
              if(pending !== 0){ const p = pending; pending = 0; go(p); }
            } else {
              animId = requestAnimationFrame(check);
            }
          }
        })(t0);
      }

      // --- gesture handling: one card per swipe ------------------------
      track.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMoved = false;
        gestureActive = true;
      }, { passive: true });

      track.addEventListener('touchmove', e => {
        if(!gestureActive) return;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if(Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy)){
          touchMoved = true;
        }
      }, { passive: true });

      track.addEventListener('touchend', e => {
        if(!gestureActive) return;
        gestureActive = false;
        const dx = (e.changedTouches[0].clientX - touchStartX);
        const dy = (e.changedTouches[0].clientY - touchStartY);
        // left swipe => advance one card; right swipe => go back one card
        if(touchMoved && Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy) * 1.2){
          go(dx < 0 ? 1 : -1);
        } else {
          // tiny/ambiguous gesture: still snap back to the nearest card
          go(0);
        }
      });

      // mouse wheel / trackpad horizontal scroll also advances card-by-card
      let wheelLock = false;
      track.addEventListener('wheel', e => {
        if(Math.abs(e.deltaX) < Math.abs(e.deltaY)) return; // page scroll wins
        e.preventDefault();
        if(wheelLock || animating) return;
        wheelLock = true;
        go(e.deltaX > 0 ? 1 : -1);
        setTimeout(() => wheelLock = false, 350);
      }, { passive: false });

      // catch any free scroll that ends between cards (momentum edge cases)
      let scrollIdle = null;
      track.addEventListener('scroll', () => {
        updateActive();
        if(animating) return;
        clearTimeout(scrollIdle);
        scrollIdle = setTimeout(() => {
          if(animating) return;
          const base = centerScrollLeft(START);
          const st = step();
          const rel = (track.scrollLeft - base) / st;
          const nearest = Math.round(rel);
          if(Math.abs(rel - nearest) > 0.02){
            n = nearest;                       // adopt wherever we are
            scrollToCard(n + START, true);     // finish centering this card
          }
        }, 140);
      }, { passive: true });

      // Initial: first card centered
      scrollToCard(START, false);
      updateActive();

      window.addEventListener('resize', () => {
        if(window.matchMedia('(max-width: 640px)').matches){
          scrollToCard(n + START, false);
          updateActive();
        }
      });
    })();
  </script>
</body>
